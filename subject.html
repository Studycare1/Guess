<!doctype html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Book View</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bar">
  <a href="index.html" class="back">← Library</a>
  <h1 id="title">Loading…</h1>
  <div class="page-info"><span id="pageInfo">0 / 0</span></div>
</div>

<div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>

<div class="viewer">
  <button class="nav-btn" id="prev" aria-label="Previous">‹</button>
  <div class="book" id="book">
    <img id="pageImg" alt="Page" src="">
    <div class="page-num" id="pageNum"></div>
  </div>
  <button class="nav-btn" id="next" aria-label="Next">›</button>
</div>

<div class="controls">
  <input type="number" id="pageInput" min="1" value="1">
  <button id="goBtn" class="neu">Go</button>
  <div class="controls-divider"></div>
  <button id="zoomOut" class="neu" title="Zoom out">−</button>
  <span class="zoom-info" id="zoomLevel">100%</span>
  <button id="zoomIn" class="neu" title="Zoom in">+</button>
  <button id="zoomReset" class="neu" title="Reset">⟲</button>
  <div class="controls-divider"></div>
  <button id="rotateBtn" class="neu" title="Rotate">🔃</button>
  <button id="fullscreenBtn" class="neu" title="Fullscreen">⛶</button>
  <button id="bookmarkBtn" class="neu" title="Bookmark">🔖</button>
  <button id="slideshowBtn" class="neu" title="Slideshow">▶️</button>
  <button id="downloadBtn" class="neu" title="Download">⬇️</button>
  <button id="shareBtn" class="neu" title="Share">🔗</button>
  <button id="helpBtn" class="neu" title="Help">❓</button>
</div>

<div class="thumbs-wrap">
  <div class="thumbs-scroll" id="thumbs"></div>
</div>

<!-- Help Modal -->
<div class="modal-overlay" id="helpOverlay">
  <div class="modal" style="position:relative">
    <button class="modal-close" id="helpClose">✕</button>
    <h2>⌨️ Keyboard Shortcuts</h2>
    <div class="kbd-row"><span>Next / Prev page</span><kbd>←</kbd> <kbd>→</kbd></div>
    <div class="kbd-row"><span>First / Last page</span><kbd>Home</kbd> <kbd>End</kbd></div>
    <div class="kbd-row"><span>Zoom in / out</span><kbd>+</kbd> <kbd>−</kbd></div>
    <div class="kbd-row"><span>Reset zoom</span><kbd>0</kbd></div>
    <div class="kbd-row"><span>Rotate</span><kbd>R</kbd></div>
    <div class="kbd-row"><span>Fullscreen</span><kbd>F</kbd></div>
    <div class="kbd-row"><span>Bookmark</span><kbd>B</kbd></div>
    <div class="kbd-row"><span>Slideshow</span><kbd>S</kbd></div>
    <div class="kbd-row"><span>Download</span><kbd>D</kbd></div>
    <div class="kbd-row"><span>Help</span><kbd>?</kbd></div>
    <p style="margin-top:16px;font-size:12px;color:var(--muted);text-align:center">
      Mobile: swipe left/right, double-tap to zoom
    </p>
  </div>
</div>

<script src="js/viewer.js"></script>
</body>
</html>
